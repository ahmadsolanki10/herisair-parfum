<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact & Client Care | Hérisair UAE</title>
  <meta name="description" content="Contact Hérisair client care for fragrance guidance, order assistance, gifting and partnership enquiries.">
  <meta property="og:title" content="Hérisair Client Care">
  <meta property="og:description" content="Our client advisors are here to assist.">
  <meta property="og:image" content="assets/images/model.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="assets/css/style.css?v=20260905-stripe-checkout-v1">
</head>
<body class="house-page utility-page contact-page">
  <header data-header></header>
  <main id="main" class="utility-main">
    <section class="utility-hero house-scroll-reveal" aria-labelledby="contact-title">
      <p class="eyebrow">Client care</p>
      <h1 id="contact-title">How may we assist?</h1>
      <p class="utility-hero-lead">For fragrance guidance, order support, gifting or partnerships, leave a message for our client advisors.</p>
    </section>
    <section class="utility-content house-scroll-reveal" aria-label="Contact Hérisair">
      <aside class="utility-content-intro">
        <p class="eyebrow">Private assistance</p>
        <h2><span>A considered</span><span>reply</span></h2>
        <div class="contact-facts">
          <p><strong>Private hours</strong>Monday–Saturday<br>10:00–18:00 GST</p>
        </div>
      </aside>
      <form class="contact-form" data-contact data-endpoint="/api/contact" novalidate>
        <div class="form-grid">
          <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
          <div class="field"><label for="subject">Enquiry</label><select id="subject" name="subject"><option>Fragrance guidance</option><option>Order assistance</option><option>Gifting</option><option>Partnership</option><option>Other</option></select></div>
          <div class="field full"><label for="message">Message</label><textarea id="message" name="message" minlength="10" required></textarea></div>
          <div class="field honey" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
        </div>
        <button class="btn">Send enquiry</button>
        <p class="form-note" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer data-footer></footer>
  <script src="assets/js/products.js?v=20260907-discovery-stripe-v1"></script>
  <script src="assets/js/main.js?v=20260907-client-care-email-v1"></script>
</body>
</html>
