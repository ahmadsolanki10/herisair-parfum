<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hérisair House — Mobile Preview</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:18px;
      background:#090402;
      color:#d8bea0;
      font-family:Arial,sans-serif;
    }
    .preview{width:min(390px,100%)}
    .preview-bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      min-height:38px;
      padding:0 4px;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .preview-bar a{color:#d8bea0;text-decoration:none}
    iframe{
      display:block;
      width:390px;
      max-width:100%;
      height:min(844px,calc(100vh - 74px));
      border:1px solid rgba(216,190,160,.28);
      border-radius:24px;
      background:#120603;
      box-shadow:0 18px 55px rgba(0,0,0,.52);
    }
  </style>
</head>
<body>
  <main class="preview">
    <div class="preview-bar">
      <span>House · 390px</span>
      <a href="our-house.html" target="_blank" rel="noopener">Open page</a>
    </div>
    <iframe src="our-house.html?preview=mobile" title="Hérisair House page mobile preview"></iframe>
  </main>
</body>
</html>
