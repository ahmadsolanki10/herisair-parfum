<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=20260909-circle">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=20260909-circle">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=20260909-circle">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hérisair — Mobile Preview</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      padding:18px;
      background:#090402;
      color:#d8bea0;
      font-family:Arial,sans-serif;
    }
    .preview{width:min(390px,100%);margin:0 auto}
    .preview-bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      min-height:38px;
      padding:0 4px;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .preview-bar a{color:#d8bea0;text-decoration:none}
    iframe{
      display:block;
      width:390px;
      max-width:100%;
      height:844px;
      border:1px solid rgba(216,190,160,.28);
      border-radius:24px;
      background:#120603;
      box-shadow:0 18px 55px rgba(0,0,0,.52);
    }
  </style>
</head>
<body>
  <main class="preview">
    <div class="preview-bar">
      <span>Mobile preview · 390px</span>
      <a href="index.html" data-open-site target="_blank" rel="noopener">Open website</a>
    </div>
    <iframe src="index.html?preview=mobile" data-mobile-frame title="Hérisair mobile preview"></iframe>
  </main>
  <script>
    const requestedPage=new URLSearchParams(location.search).get('page');
    if(requestedPage&&/^[a-z0-9-]+\.html$/i.test(requestedPage)){
      document.querySelector('[data-mobile-frame]').src=requestedPage+'?preview=mobile';
      document.querySelector('[data-open-site]').href=requestedPage;
    }
  </script>
</body>
</html>
